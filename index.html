<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC NP - Device Service Portal</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="brand">
                <i class="fas fa-tools"></i>
                <h1>AMC<span>NP</span></h1>
            </div>
            <h2>Manage Your Device Services</h2>
            <p>Track annual service records for all your electronic devices in one place.</p>
            <ul class="features">
                <li><i class="fas fa-check-circle"></i> Service History Tracking</li>
                <li><i class="fas fa-check-circle"></i> Annual Reminders</li>
                <li><i class="fas fa-check-circle"></i> Easy Booking</li>
                <li><i class="fas fa-check-circle"></i> Digital Reports</li>
            </ul>
        </div>

        <div class="right-panel">
            <div class="form-container">
                <div class="tabs">
                    <button class="tab active" data-tab="login">Login</button>
                </div>

                <form id="loginForm" class="form active">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Login to your account</p>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class="fas fa-eye toggle-password" data-target="loginPassword"></i>
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>

                    <div class="divider"><span>OR</span></div>

                    <button type="button" class="btn-social btn-google" id="googleLoginBtn">
                        <i class="fab fa-google"></i> Continue with Google
                    </button>
                </form>

                <div id="message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
