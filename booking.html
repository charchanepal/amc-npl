<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Booking - AMC NP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-tools"></i>
            <h2>AMC<span>NP</span></h2>
            <button class="close-btn" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <ul class="nav-menu">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="devices.html"><i class="fas fa-laptop"></i> My Devices</a></li>
            <li class="active"><a href="booking.html"><i class="fas fa-calendar-check"></i> Service Requests</a></li>
            <li><a href="history.html"><i class="fas fa-history"></i> Service History</a></li>
            <li><a href="bills.html"><i class="fas fa-file-invoice"></i> Bills</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li id="adminLink" style="display:none"><a href="admin.html"><i class="fas fa-shield-alt"></i> Admin Panel</a></li>
            <li id="techLink" style="display:none"><a href="technician.html"><i class="fas fa-hard-hat"></i> Technician Panel</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <h1 style="font-size:20px;color:#2c3e50"><i class="fas fa-calendar-check" style="color:#667eea"></i> Service Booking</h1>
            <div class="user-info" id="profileBtn" style="margin-left:auto">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <div class="user-name" id="userName">User</div>
                    <div class="user-role" id="userRole">Customer</div>
                </div>
            </div>
        </header>
        <div class="content">

        <div class="form-card">
            <h2>Book a New Service</h2>
            <form onsubmit="bookService(event)">
                <label>Select Device *</label>
                <select id="bDevice" required>
                    <option value="">-- Choose Device --</option>
                </select>

                <label>Service Type *</label>
                <select id="bType" required>
                    <option value="">-- Choose Service --</option>
                    <option value="Routine Checkup">Routine Checkup</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Repair">Repair</option>
                    <option value="Full Service">Full Service</option>
                    <option value="Installation">Installation</option>
                </select>

                <label>Preferred Date *</label>
                <input type="date" id="bDate" required>

                <label>Preferred Time *</label>
                <select id="bTime" required>
                    <option value="">-- Choose Time --</option>
                    <option>09:00 AM - 11:00 AM</option>
                    <option>11:00 AM - 01:00 PM</option>
                    <option>02:00 PM - 04:00 PM</option>
                    <option>04:00 PM - 06:00 PM</option>
                </select>

                <label>Issue Description *</label>
                <textarea id="bIssue" rows="4" placeholder="Describe the issue..." required></textarea>

                <button type="submit" class="btn"><i class="fas fa-check"></i> Book Service</button>
            </form>
        </div>

        <h2 style="margin-top:30px">My Bookings</h2>
        <div id="bookingsList"></div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="booking.js"></script>
</body>
</html>
